# Checks every pull request (and main) before it can ship:
#   1. the committed game bundle matches the source,
#   2. the balance simulation still has the intended shape,
#   3. a scripted browser playthrough works on desktop and phone, with analytics only after consent.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bundle is rebuilt and committed
        run: |
          npm run build
          git diff --exit-code --stat js/game.bundle.js || { echo "::error::js/game.bundle.js is out of date. Run 'npm run build' and commit it."; exit 1; }
      - name: Balance simulation
        run: npm run check:balance
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser playthrough
        run: npm run smoke -- --shots smoke-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore
