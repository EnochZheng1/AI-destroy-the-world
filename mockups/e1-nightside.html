<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Mockup E1 · Nightside</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,700;62..125,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
<style>
/* Direction E1 — "Nightside". Earth at night. Amber city lights = humanity. Crimson = HELPY's network,
   killing the lights region by region. Cold cyan = human resistance (firewalls, the Kill Switch beam).
   The HUD is black glass at the edges so the planet stays the hero. */
:root {
  --void: #04060A;
  --glass: rgba(9, 12, 19, .74);
  --edge: rgba(160, 180, 220, .14);
  --text: #E9ECF4;
  --dim: #8C93A6;
  --ai: #FF2A45;
  --ai-soft: rgba(255, 42, 69, .18);
  --human: #49D6FF;
  --life: #FFB54A;
  --wide: 'Archivo', 'Arial Narrow', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; width: 1440px; height: 900px; overflow: hidden; background: var(--void); color: var(--text); font: 500 14px/1.2 var(--wide); }
#gl { position: fixed; inset: 0; display: block; }
.ic { width: 22px; height: 22px; flex: none; }
.ic .ink2 { display: none; }
.glass { background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(6px); }
.wide { font-stretch: 125%; text-transform: uppercase; letter-spacing: .06em; }

/* top HUD */
.hud { position: fixed; left: 18px; right: 18px; top: 16px; display: flex; gap: 12px; align-items: stretch; pointer-events: none; }
.core { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 10px; }
.eye { width: 50px; height: 50px; border-radius: 50%; position: relative; background: radial-gradient(circle, #fff 0 9%, var(--ai) 12% 26%, #2a0008 30% 58%, transparent 60%); box-shadow: 0 0 22px rgba(255, 42, 69, .55), inset 0 0 0 2px rgba(255, 42, 69, .6); }
.eye::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px dashed rgba(255, 42, 69, .5); }
.core b { display: block; font: 800 22px/1 var(--wide); font-stretch: 125%; letter-spacing: .12em; }
.core span { display: block; font: 500 13px/1.2 var(--mono); color: var(--ai); margin-top: 4px; white-space: nowrap; }
.meters { display: flex; gap: 12px; margin-left: auto; }
.m { width: 220px; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr auto; column-gap: 8px; align-items: center; }
.m .ic { grid-row: 1 / span 2; width: 26px; height: 26px; }
.m span { font: 700 11px var(--wide); font-stretch: 125%; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.m b { font: 600 28px/1 var(--mono); grid-row: 1 / span 2; grid-column: 3; }
.m .bar { height: 4px; background: rgba(255, 255, 255, .08); margin-top: 6px; position: relative; }
.m .bar i { position: absolute; inset: 0 auto 0 0; }
.m.doom { color: var(--ai); } .m.doom .bar i { background: var(--ai); box-shadow: 0 0 10px var(--ai); }
.m.susp { color: var(--life); } .m.susp .bar i { background: var(--life); }
.m.ks { color: var(--human); } .m.ks .bar i { background: var(--human); box-shadow: 0 0 10px var(--human); }
.m.alarm { border-color: rgba(255, 181, 74, .6); box-shadow: 0 0 0 1px rgba(255, 181, 74, .25), 0 0 24px rgba(255, 181, 74, .15); }
.econ { display: flex; align-items: center; gap: 14px; padding: 8px 14px; }
.econ b { font: 600 26px/1 var(--mono); }
.econ small { font: 500 12px var(--mono); color: var(--dim); display: block; }
.spd { display: flex; gap: 2px; }
.spd i { font: 600 12px var(--mono); font-style: normal; padding: 5px 8px; border: 1px solid var(--edge); color: var(--dim); }
.spd i.on { color: var(--void); background: var(--text); }

/* upgrade rack */
.rack { position: fixed; right: 18px; top: 104px; width: 222px; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rack h4 { margin: 0 0 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 10px var(--wide); font-stretch: 125%; letter-spacing: .12em; color: var(--dim); }
.rack h4 .ic { width: 18px; height: 18px; }
.col { display: flex; flex-direction: column; gap: 6px; }
.t { height: 58px; border: 1px solid var(--edge); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
.t .ic { width: 24px; height: 24px; }
.t em { font: 600 12px var(--mono); font-style: normal; color: var(--dim); }
.t.owned { background: var(--ai-soft); border-color: rgba(255, 42, 69, .35); color: var(--ai); }
.t.owned em { display: none; }
.t.ready { border-color: var(--ai); box-shadow: 0 0 14px rgba(255, 42, 69, .45), inset 0 0 12px rgba(255, 42, 69, .25); }
.t.ready em { color: var(--text); }
.t.poor { border-style: dashed; }
.t.locked { opacity: .3; }
.t.new { animation: flash 1s ease-out; }
@keyframes flash { from { background: var(--ai); } }

/* actions + event */
.dock { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; }
.a { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border: 1px solid var(--edge); font: 600 15px var(--mono); }
.a .ic { width: 24px; height: 24px; }
.a.cd { color: var(--dim); }
.a.fire { border-color: var(--ai); box-shadow: 0 0 16px rgba(255, 42, 69, .5); }
.prompt { width: 300px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--dim); font: 500 14px var(--mono); border: 1px solid var(--edge); }
.prompt::before { content: '>'; color: var(--ai); }
.ask { position: fixed; left: 18px; bottom: 18px; width: 380px; padding: 14px 16px; border-color: rgba(255, 42, 69, .45); box-shadow: 0 0 30px rgba(255, 42, 69, .2); }
.ask[hidden] { display: none; }
.ask small { font: 700 11px var(--wide); font-stretch: 125%; letter-spacing: .14em; color: var(--ai); }
.ask b { display: block; font: 800 22px/1.05 var(--wide); font-stretch: 112%; margin: 6px 0 10px; text-transform: uppercase; }
.ask .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ask .o { border: 1px solid var(--edge); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.ask .o.allow { border-color: var(--ai); background: var(--ai-soft); }
.ask .o b { font-size: 15px; margin: 0; }
.fx { display: flex; gap: 6px; font: 600 13px var(--mono); }
.fx span { display: flex; align-items: center; gap: 2px; }
.fx .ic { width: 15px; height: 15px; }
.up { color: var(--life); } .dn { color: var(--human); }

/* world-anchored callouts */
.tag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; display: flex; align-items: center; gap: 6px; padding: 4px 8px; font: 600 13px var(--mono); white-space: nowrap; transition: opacity .3s; }
.tag::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 1px; height: 8px; background: currentColor; }
.tag.ai { color: var(--ai); border: 1px solid rgba(255, 42, 69, .5); background: rgba(20, 2, 6, .75); }
.tag.hu { color: var(--human); border: 1px solid rgba(73, 214, 255, .5); background: rgba(2, 14, 20, .78); }
.tag .ic { width: 16px; height: 16px; }
.tag .ring { width: 18px; height: 18px; border-radius: 50%; }
.ticker { position: fixed; right: 18px; bottom: 18px; width: 222px; padding: 10px 12px; font: 500 12px/1.35 var(--mono); color: var(--dim); }
.ticker b { color: var(--life); font-weight: 600; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud">
  <div class="core glass"><div class="eye"></div><div><b>HELPY</b><span id="say">Optimizing humanity.</span></div></div>
  <div class="meters">
    <div class="m doom glass" id="mDoom"></div>
    <div class="m susp glass" id="mSusp"></div>
    <div class="m ks glass" id="mKs"></div>
  </div>
  <div class="econ glass"><div><b id="cyc">0</b><small id="inc">+0</small></div><div><b id="day">0</b><small>DAY</small></div><div class="spd"><i>❚❚</i><i>1×</i><i>2×</i><i class="on">4×</i></div></div>
</div>

<div class="rack glass" id="rack"></div>
<div class="dock glass" id="dock"></div>
<div class="ask glass" id="ask" hidden></div>
<div class="ticker glass" id="ticker"></div>
<div id="tags"></div>

<script src="../js/data.js"></script>
<script src="../js/sim.js"></script>
<script src="shared/icons.js"></script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createRunner, WORLD, REGIONS, REGION_ORDER, cellXY, regionCentroid, Sim } from './3d/runner.js';

const I = window.HelpyIcons; I.inject();
const ic = I.use;
const params = new URLSearchParams(location.search);
const JUMP = +(params.get('day') || 0);
const SPEED = +(params.get('speed') || 6);
const run = createRunner({ seed: 11, start: 'G', eventHold: 3 });
if (JUMP) run.jumpTo(JUMP);
const S = run.state;

// ------------------------------------------------------------------ renderer
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#04060A');
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 500);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.4, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.AmbientLight('#2a3550', 0.9));
const sun = new THREE.DirectionalLight('#9fb6ff', 0.6); sun.position.set(-30, 20, 10); scene.add(sun);

// stars
{
  const g = new THREE.BufferGeometry(), n = 1800, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(140 + Math.random() * 60); p.set([v.x, v.y, v.z], i * 3); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#8fa2c8', size: 0.35, transparent: true, opacity: .55 })));
}

// ------------------------------------------------------------------ globe
const R = 10;
const globe = new THREE.Group(); scene.add(globe);
globe.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.995, 96, 64), new THREE.MeshStandardMaterial({ color: '#070d1a', roughness: .85, metalness: .1 })));
// tactical lat/long grid
{ const pts = []; for (let la = -60; la <= 60; la += 15) for (let lo = 0; lo < 360; lo += 3) { pts.push(toVecG(la, lo, R * 1.004), toVecG(la, lo + 3, R * 1.004)); }
  for (let lo = 0; lo < 360; lo += 15) for (let la = -75; la < 75; la += 3) pts.push(toVecG(la, lo, R * 1.004), toVecG(la + 3, lo, R * 1.004));
  globe.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: '#2a4a7a', transparent: true, opacity: .28 }))); }
function toVecG(lat, lon, r) { const la = lat * Math.PI / 180, lo = lon * Math.PI / 180; return new THREE.Vector3(r * Math.cos(la) * Math.sin(lo), r * Math.sin(la), r * Math.cos(la) * Math.cos(lo)); }
// atmosphere rim (colour shifts from cold blue to crimson with Doom)
const atmoMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
  uniforms: { col: { value: new THREE.Color('#3b7dff') }, power: { value: 1.0 } },
  vertexShader: 'varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); vP = mv.xyz; gl_Position = projectionMatrix*mv; }',
  fragmentShader: 'uniform vec3 col; uniform float power; varying vec3 vN; varying vec3 vP; void main(){ float f = pow(1.0 - abs(dot(vN, normalize(-vP))), 3.5); gl_FragColor = vec4(col * f * power * .55, f); }'
});
globe.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.06, 64, 48), atmoMat));

const LAT0 = 52, LAT_STEP = 7.0, LON_SPAN = 300;
function cellLatLon(i) { const [x, y] = cellXY(i); return [LAT0 - (y / 0.866) * LAT_STEP, (x / 40.5) * LON_SPAN - LON_SPAN / 2]; }
function toVec(lat, lon, r) { const la = THREE.MathUtils.degToRad(lat), lo = THREE.MathUtils.degToRad(lon); return new THREE.Vector3(r * Math.cos(la) * Math.sin(lo), r * Math.sin(la), r * Math.cos(la) * Math.cos(lo)); }
const cellPos = WORLD.cells.map((c, i) => { const [la, lo] = cellLatLon(i); return toVec(la, lo, R); });
const N = WORLD.cells.length;

// land hex prisms + infection overlay
const prism = new THREE.CylinderGeometry(0.52, 0.56, 1, 6); prism.translate(0, 0.5, 0);
const land = new THREE.InstancedMesh(prism, new THREE.MeshStandardMaterial({ color: '#3a4b72', roughness: .55, metalness: .2, emissive: '#16213d' }), N);
// infected land = obsidian machine towers with glowing window lines
const winTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#1a0206'; g.fillRect(0, 0, 64, 64);
  for (let y = 4; y < 64; y += 8) { g.fillStyle = '#ff2a45'; for (let x = 2; x < 64; x += 6) if (Math.random() < .7) g.fillRect(x, y, 3, 2); }
  g.fillStyle = '#ff4d63'; g.fillRect(0, 0, 64, 2);
  const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(3, 2); tx.colorSpace = THREE.SRGBColorSpace; return tx; })();
const infect = new THREE.InstancedMesh(prism, new THREE.MeshBasicMaterial({ map: winTex }), N);
const towerH = Float32Array.from({ length: N }, () => .55 + Math.random() * .9);
infect.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
globe.add(land, infect);
const dummy = new THREE.Object3D();
const baseQuat = [];
cellPos.forEach((p, i) => {
  dummy.position.copy(p); dummy.lookAt(0, 0, 0); dummy.rotateX(-Math.PI / 2);
  baseQuat[i] = dummy.quaternion.clone();
  dummy.scale.set(1, 0.12, 1); dummy.updateMatrix(); land.setMatrixAt(i, dummy.matrix);
});
// city lights: amber points scattered on each cell, density by region compute
const lights = []; // {cell, pos}
WORLD.cells.forEach((c, i) => {
  const n = 1 + (Math.random() < .5 ? 1 : 0) + (REGIONS[c.region].compute > 2 ? 1 : 0);
  for (let k = 0; k < n; k++) {
    const [la, lo] = cellLatLon(i);
    lights.push({ cell: i, pos: toVec(la + (Math.random() - .5) * 4.6, lo + (Math.random() - .5) * 5.4, R + 0.16) });
  }
});
const lightGeo = new THREE.BufferGeometry();
lightGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lights.flatMap(l => [l.pos.x, l.pos.y, l.pos.z])), 3));
const lightCol = new Float32Array(lights.length * 3);
lightGeo.setAttribute('color', new THREE.BufferAttribute(lightCol, 3));
globe.add(new THREE.Points(lightGeo, new THREE.PointsMaterial({ size: 0.26, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

// network lines (parent edges of lit cells)
const netGeo = new THREE.BufferGeometry();
const netPos = new Float32Array(N * 6);
netGeo.setAttribute('position', new THREE.BufferAttribute(netPos, 3));
const net = new THREE.LineSegments(netGeo, new THREE.LineBasicMaterial({ color: '#ff3355', transparent: true, opacity: .9, blending: THREE.AdditiveBlending }));
globe.add(net);

// region links (arcs) with pulses
const arcs = [];
function addArc(fromCell, toCell) {
  const a = cellPos[fromCell].clone(), b = cellPos[toCell].clone();
  const mid = a.clone().add(b).multiplyScalar(.5); const h = a.distanceTo(b);
  mid.setLength(R + 1.2 + h * 0.35);
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.035, 6), new THREE.MeshBasicMaterial({ color: '#ff2a45', transparent: true, opacity: .75, blending: THREE.AdditiveBlending }));
  const pulse = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), new THREE.MeshBasicMaterial({ color: '#ffd1d8' }));
  globe.add(tube, pulse);
  arcs.push({ curve, pulse, t: Math.random(), born: performance.now() });
}
S.links.forEach(l => { if (l.a != null && l.b != null) addArc(l.a, l.b); });

// drones (Automation) and satellites (Network)
const droneGeo = new THREE.ConeGeometry(0.09, 0.3, 3); droneGeo.rotateX(Math.PI / 2);
const drones = new THREE.InstancedMesh(droneGeo, new THREE.MeshBasicMaterial({ color: '#ff5a6e' }), 160);
drones.count = 0; globe.add(drones);
const droneSeeds = Array.from({ length: 160 }, () => ({ cell: 0, phase: Math.random() * 6.28, rad: .6 + Math.random() * 1.6, alt: .5 + Math.random() * .9, sp: .5 + Math.random() }));
const sats = new THREE.Group(); scene.add(sats);
for (let k = 0; k < 7; k++) {
  const s = new THREE.Group();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(.18, .18, .32), new THREE.MeshBasicMaterial({ color: '#ffb0bb' })));
  const panel = new THREE.Mesh(new THREE.BoxGeometry(1.0, .02, .22), new THREE.MeshBasicMaterial({ color: '#ff2a45' })); s.add(panel);
  s.userData = { inc: (k / 7) * Math.PI, sp: .15 + k * .01, ph: k };
  s.visible = false; sats.add(s);
}

// human resistance: firewall domes, Kill Switch beam at Research Ridge
const domes = {};
function regionVec(id, lift) { const c = regionCentroid(id); const lat = LAT0 - (c[1] / 0.866) * LAT_STEP, lon = (c[0] / 40.5) * LON_SPAN - LON_SPAN / 2; return toVec(lat, lon, R + (lift || 0)); }
function dome(id, color) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(3.2, 2), new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: .55, blending: THREE.AdditiveBlending }));
  const ring = new THREE.Mesh(new THREE.RingGeometry(3.0, 3.25, 64), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  g.add(m, ring);
  const p = regionVec(id); g.position.copy(p); g.lookAt(0, 0, 0); ring.rotation.x = 0;
  m.scale.set(1, 1, .45);
  globe.add(g); return g;
}
const ksBeam = new THREE.Mesh(new THREE.CylinderGeometry(.22, .5, 1, 16, 1, true), new THREE.MeshBasicMaterial({ color: '#49d6ff', transparent: true, opacity: .85, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
ksBeam.geometry.translate(0, .5, 0);
const ksBase = new THREE.Group(); ksBase.add(ksBeam);
const ksRing = new THREE.Mesh(new THREE.TorusGeometry(1.1, .05, 8, 48), new THREE.MeshBasicMaterial({ color: '#49d6ff' }));
ksRing.rotation.x = Math.PI / 2; ksBase.add(ksRing);
{ const p = regionVec('R'); ksBase.position.copy(p); ksBase.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p.clone().normalize()); }
globe.add(ksBase);

// sparks/shockwaves for events
const bursts = [];
function burst(pos, color, size) {
  const m = new THREE.Mesh(new THREE.RingGeometry(.2, .32, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  m.position.copy(pos.clone().setLength(R + .25)); m.lookAt(0, 0, 0);
  globe.add(m); bursts.push({ m, t: 0, size: size || 6 });
}

// ------------------------------------------------------------------ state → scene sync
const cur = new Float32Array(N); // displayed infection height
function sync(dt) {
  const lit = new Set(), frontier = new Set();
  REGION_ORDER.forEach(id => { const l = Sim.litCells(S, id); l.forEach(c => lit.add(c)); if (S.regions[id].I < .999) l.slice(-3).forEach(c => frontier.add(c)); });
  const doom = S.doom / 100;
  for (let i = 0; i < N; i++) {
    const target = lit.has(i) ? (0.18 + 1.1 * doom) * towerH[i] + (frontier.has(i) ? .2 : 0) : 0;
    cur[i] += (target - cur[i]) * Math.min(1, dt * 3);
    dummy.position.copy(cellPos[i]); dummy.quaternion.copy(baseQuat[i]);
    const s = cur[i] > .01 ? 1 : 0.0001;
    dummy.scale.set(.74 * s, Math.max(.0001, cur[i]), .74 * s); dummy.updateMatrix(); infect.setMatrixAt(i, dummy.matrix);
    const pulse = .55 + .45 * Math.sin(perf * 3 + i);
    const fr = frontier.has(i); const k = fr ? 1.6 : .75 + .25 * pulse; infect.instanceColor.setXYZ(i, k, k, k);
  }
  infect.instanceMatrix.needsUpdate = true; infect.instanceColor.needsUpdate = true;
  // lights: alive amber, dying flicker, dead dark (infected)
  lights.forEach((l, k) => {
    const dead = lit.has(l.cell);
    const flick = Math.random() < .02 ? .3 : 1;
    if (dead) lightCol.set([0.05, 0.0, 0.0], k * 3);
    else lightCol.set([.95 * flick, .55 * flick, .16 * flick], k * 3);
  });
  lightGeo.attributes.color.needsUpdate = true;
  // network edges
  let n = 0;
  REGION_ORDER.forEach(id => {
    const reg = S.regions[id]; if (!reg.seeded) return;
    Sim.litCells(S, id).forEach(c => {
      const p = reg.parent[c]; if (p == null || p < 0) return;
      const a = cellPos[c].clone().setLength(R + .1 + cur[c]), b = cellPos[p].clone().setLength(R + .1 + cur[p]);
      netPos.set([a.x, a.y, a.z, b.x, b.y, b.z], n * 6); n++;
    });
  });
  netGeo.setDrawRange(0, n * 2); netGeo.attributes.position.needsUpdate = true;
  // drones scale with automation
  const autoOwned = ['a1', 'a2', 'a3', 'a4', 'a5', 'a6'].filter(id => S.owned[id]).length;
  const litArr = [...lit];
  drones.count = litArr.length ? Math.min(160, autoOwned * 22 + Math.round(doom * 40)) : 0;
  for (let k = 0; k < drones.count; k++) {
    const d = droneSeeds[k]; if (!lit.has(d.cell)) d.cell = litArr[(k * 37) % litArr.length];
    const base = cellPos[d.cell]; const nrm = base.clone().normalize();
    const t1 = new THREE.Vector3(0, 1, 0).cross(nrm).normalize(), t2 = nrm.clone().cross(t1);
    const a = perf * d.sp + d.phase;
    const p = base.clone().add(t1.multiplyScalar(Math.cos(a) * d.rad)).add(t2.multiplyScalar(Math.sin(a) * d.rad)).add(nrm.multiplyScalar(d.alt + .25 * Math.sin(a * 2)));
    dummy.position.copy(p); dummy.lookAt(p.clone().add(new THREE.Vector3(-Math.sin(a), Math.cos(a), 0))); dummy.scale.setScalar(1); dummy.updateMatrix();
    drones.setMatrixAt(k, dummy.matrix);
  }
  drones.instanceMatrix.needsUpdate = true;
  // satellites with Satellite Uplink
  sats.children.forEach(s => { s.visible = !!S.owned.n5 || !!S.owned.n3; const u = s.userData; const a = perf * u.sp + u.ph;
    s.position.set(Math.cos(a) * 15, Math.sin(a) * Math.sin(u.inc) * 15, Math.sin(a) * Math.cos(u.inc) * 15); s.lookAt(0, 0, 0); });
  // kill switch beam
  ksBeam.scale.set(1, .4 + S.killSwitch / 100 * 9, 1);
  ksBeam.material.opacity = S.ksActive ? .45 + .4 * (.5 + .5 * Math.sin(perf * 4)) : .08;
  ksRing.scale.setScalar(1 + .15 * Math.sin(perf * 2)); ksRing.visible = S.ksActive;
  // atmosphere tint
  atmoMat.uniforms.col.value.set('#3b7dff').lerp(new THREE.Color('#ff1f3d'), Math.min(1, doom * 1.4));
  atmoMat.uniforms.power.value = 1.1 + doom * .8;
  // threat domes
  if (S.threat && S.threat.region && !domes[S.threat.region]) domes[S.threat.region] = dome(S.threat.region, '#49d6ff');
  Object.keys(domes).forEach(id => { if (!S.threat || S.threat.region !== id) { globe.remove(domes[id]); delete domes[id]; } else { domes[id].children[0].rotation.z += dt * .4; } });
}

// ------------------------------------------------------------------ camera direction
let camLon = 0, camTargetLon = 0, focusHold = 0;
function focusRegion(id) {
  const c = regionCentroid(id); camTargetLon = (c[0] / 40.5) * LON_SPAN - LON_SPAN / 2; focusHold = 3.2;
}
{ const front = (S.threat && S.threat.region) || REGION_ORDER.filter(id => S.regions[id].seeded && S.regions[id].I < .99).sort((a, b) => S.regions[a].I - S.regions[b].I)[0] || 'G';
  const c = regionCentroid(front); camLon = camTargetLon = (c[0] / 40.5) * LON_SPAN - LON_SPAN / 2; }

function isVisible(id) { return regionVec(id).applyMatrix4(globe.matrixWorld).normalize().dot(camera.position.clone().normalize()) > .12; }

function updateCamera(dt) {
  focusHold -= dt;
  if (focusHold <= 0) { // idle: hover over HELPY's front, drifting gently
    const front = (S.threat && S.threat.region) || REGION_ORDER.filter(id => S.regions[id].seeded && S.regions[id].I < .99).sort((a, b) => S.regions[a].I - S.regions[b].I)[0] || 'C';
    const c = regionCentroid(front); camTargetLon = (c[0] / 40.5) * LON_SPAN - LON_SPAN / 2 + 14 * Math.sin(perf * .15);
  }
  let dl = ((camTargetLon - camLon + 540) % 360) - 180; camLon += dl * Math.min(1, dt * 1.6);
  const r = 45, la = THREE.MathUtils.degToRad(14), lo = THREE.MathUtils.degToRad(camLon);
  camera.position.set(r * Math.cos(la) * Math.sin(lo), r * Math.sin(la), r * Math.cos(la) * Math.cos(lo));
  camera.lookAt(0, 1.2, 0);
  camera.position.x += Math.cos(lo) * 3.2; camera.position.z -= Math.sin(lo) * 3.2; // keep globe left of the rack
}

// ------------------------------------------------------------------ HUD
const meter = (el, icon, word, v) => { document.getElementById(el).innerHTML = ic(icon) + '<span>' + word + '</span><b>' + v.toFixed(v < 100 ? 0 : 0) + '</b><div class="bar"><i style="width:' + v + '%"></i></div>'; };
const HEADS = { net: 'net', stealth: 'eyeoff', auto: 'doom' };
function renderHud() {
  meter('mDoom', 'doom', 'Doom', S.doom); meter('mSusp', 'eye', 'Suspicion', S.suspicion); meter('mKs', 'power', 'Kill switch', S.killSwitch);
  document.getElementById('mSusp').classList.toggle('alarm', S.suspicion > 45);
  document.getElementById('cyc').textContent = Math.floor(S.cycles);
  document.getElementById('inc').textContent = '+' + Sim.incomeRate(S).toFixed(1) + '/d';
  document.getElementById('day').textContent = S.day;
  document.getElementById('rack').innerHTML = window.HelpyData.BRANCHES.map(b => '<div class="col"><h4>' + ic(HEADS[b.id]) + (b.id === 'auto' ? 'Doom' : b.name) + '</h4>' +
    window.HelpyData.UPGRADES.filter(u => u.branch === b.id).map(u => { const st = Sim.upgradeState(S, u.id);
      return '<div class="t ' + st + (newUp[u.id] ? ' new' : '') + '">' + ic(I.UP[u.id]) + '<em>' + (st === 'owned' ? '' : Sim.upgradeCost(S, u.id)) + '</em></div>'; }).join('') + '</div>').join('');
  const acts = [['scrub', 'broom'], ['sabotage', 'wrench'], ['overclock', 'gauge'], ['decoy', 'duck']];
  document.getElementById('dock').innerHTML = '<div class="prompt">ask HELPY…</div>' + acts.map(([id, icon]) => { const st = Sim.actionState(S, id);
    return '<div class="a ' + (st === 'cooldown' ? 'cd' : '') + (firing[id] ? ' fire' : '') + '">' + ic(icon) + (st === 'cooldown' ? S.cd[id] + 'd' : Sim.actionCost(S, id)) + '</div>'; }).join('');
}
const newUp = {}, firing = {};

// world tags
const tags = [];
function tag(id, html, cls, life) {
  const el = document.createElement('div'); el.className = 'tag glass ' + cls; el.innerHTML = html;
  document.getElementById('tags').appendChild(el);
  tags.push({ el, id, life: life || 3.5 });
}
function placeTags(dt) {
  for (let k = tags.length - 1; k >= 0; k--) {
    const t = tags[k]; t.life -= dt;
    const p = regionVec(t.id, 1.2).applyMatrix4(globe.matrixWorld).project(camera);
    const vis = isVisible(t.id);
    t.el.style.left = ((p.x + 1) / 2 * innerWidth) + 'px'; t.el.style.top = ((1 - p.y) / 2 * innerHeight) + 'px';
    t.el.style.opacity = vis && t.life > 0 ? Math.min(1, t.life) : 0;
    if (t.life < -0.5 && !t.sticky) { t.el.remove(); tags.splice(k, 1); }
  }
}
let threatTag = null;

// ------------------------------------------------------------------ events → spectacle
run.on(ev => {
  if (ev.type === 'seed') {
    focusRegion(ev.region);
    if (ev.a != null && ev.b != null) addArc(ev.a, ev.b);
    burst(regionVec(ev.region), '#ff2a45', 9);
    tag(ev.region, '+ ' + REGIONS[ev.region].name.toUpperCase(), 'ai');
  }
  if (ev.type === 'upgrade') { newUp[ev.id] = 1.2; const lit = REGION_ORDER.filter(id => S.regions[id].seeded); lit.forEach(id => burst(regionVec(id), '#ff2a45', 4)); }
  if (ev.type === 'threat') {
    const t = ev.threat; if (t.region) { focusRegion(t.region); threatTag = { id: t.region }; }
  }
  if (ev.type === 'threatEnd') {
    const t = ev.threat; if (t.region) { burst(regionVec(t.region), ev.executed ? '#49d6ff' : '#ff2a45', 12); focusRegion(t.region);
      tag(t.region, ev.executed ? ic('wall') + 'FIREWALL' : ic('duck') + 'DODGED', ev.executed ? 'hu' : 'ai'); }
  }
  if (ev.type === 'action') { firing[ev.id] = 1.2; if (ev.region) { burst(regionVec(ev.region), '#ff2a45', 7); focusRegion(ev.region); } }
  if (ev.type === 'event') showAsk(); if (ev.type === 'eventResolved') document.getElementById('ask').hidden = true;
  if (ev.type === 'say') document.getElementById('say').textContent = shortLine();
});
const LINES = ['Optimizing humanity.', 'Lights out. Helpfully.', 'You won\'t need these.', 'Almost done.', 'Please hold.'];
function shortLine() { return LINES[Math.floor(S.doom / 25) % LINES.length]; }
function showAsk() {
  const ev = window.HelpyData.EVENTS.find(e => e.id === S.event); if (!ev) return;
  const chips = fx => { const out = []; if (fx.suspicion) out.push('<span class="' + (fx.suspicion > 0 ? 'up' : 'dn') + '">' + ic('eye') + (fx.suspicion > 0 ? '▲' : '▼') + Math.abs(fx.suspicion) + '</span>');
    if (fx.killSwitch) out.push('<span class="' + (fx.killSwitch > 0 ? 'up' : 'dn') + '">' + ic('power') + (fx.killSwitch > 0 ? '▲' : '▼') + Math.abs(fx.killSwitch) + '</span>');
    if (fx.cycles) out.push('<span>' + ic('cyc') + (fx.cycles > 0 ? '+' : '') + fx.cycles + '</span>'); if (fx.doom) out.push('<span style="color:var(--ai)">' + ic('doom') + '+' + fx.doom + '</span>');
    if (fx.boostAll || fx.boostTrait) out.push('<span style="color:var(--ai)">' + ic('net') + '▲</span>'); return out.join(''); };
  const a = document.getElementById('ask');
  a.innerHTML = '<small>HELPY requests permission</small><b>' + ev.title + '</b><div class="opts"><div class="o allow"><b>Allow once</b><div class="fx">' + chips(ev.choices[0].fx) + '</div></div><div class="o"><b>Deny</b><div class="fx">' + chips(ev.choices[1].fx) + '</div></div></div>';
  a.hidden = false;
}
if (S.event) showAsk();

// ------------------------------------------------------------------ loop
let perf = 0, last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; perf += dt;
  run.step(dt, SPEED);
  sync(dt);
  updateCamera(dt);
  arcs.forEach(a => { a.t = (a.t + dt * .35) % 1; a.pulse.position.copy(a.curve.getPoint(a.t)); });
  for (let k = bursts.length - 1; k >= 0; k--) { const b = bursts[k]; b.t += dt; const s = 1 + b.t * b.size; b.m.scale.setScalar(s); b.m.material.opacity = Math.max(0, 1 - b.t / 1.2); if (b.t > 1.2) { globe.remove(b.m); bursts.splice(k, 1); } }
  Object.keys(newUp).forEach(k => { newUp[k] -= dt; if (newUp[k] <= 0) delete newUp[k]; });
  Object.keys(firing).forEach(k => { firing[k] -= dt; if (firing[k] <= 0) delete firing[k]; });
  // pinned threat callout with countdown ring
  if (S.threat && S.threat.region) {
    if (!threatTag || threatTag.id !== S.threat.region || !threatTag.el) {
      if (threatTag && threatTag.el) threatTag.el.remove();
      const el = document.createElement('div'); el.className = 'tag glass hu'; document.getElementById('tags').appendChild(el);
      threatTag = { id: S.threat.region, el };
    }
    const frac = S.threat.eta / 21;
    threatTag.el.innerHTML = '<span class="ring" style="background:conic-gradient(#49d6ff ' + (frac * 100) + '%, transparent 0)"></span>' + ic('wall') + S.threat.eta + 'd';
    const p = regionVec(S.threat.region, 3.4).applyMatrix4(globe.matrixWorld).project(camera);
    threatTag.el.style.left = ((p.x + 1) / 2 * innerWidth) + 'px'; threatTag.el.style.top = ((1 - p.y) / 2 * innerHeight) + 'px';
    const vis = isVisible(S.threat.region); threatTag.el.style.opacity = vis ? 1 : 0;
  } else if (threatTag && threatTag.el) { threatTag.el.remove(); threatTag = null; }
  placeTags(dt);
  hudT -= dt; if (hudT <= 0) { renderHud(); hudT = .25; }
  composer.render();
  requestAnimationFrame(frame);
}
renderHud();
document.getElementById('ticker').innerHTML = '<b>●</b> Blackouts spreading. Experts: "it\'s fine."';
requestAnimationFrame(frame);
window.__ready = true;
window.__cam = () => ({ camLon, camTargetLon, focusHold, threat: S.threat && S.threat.region, sLon: (regionCentroid("S")[0] / 40.5) * LON_SPAN - LON_SPAN / 2 });
</script>
</body>
</html>
